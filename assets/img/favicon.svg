<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular clip path for inner sunburst rays -->
    <clipPath id="inner-circle-clip">
      <circle cx="250" cy="250" r="162" />
    </clipPath>

    <!-- Curved text paths for circular text layout -->
    <!-- Top Arc: Reads "LOVELY PROFESSIONAL UNIVERSITY" clockwise -->
    <path id="text-path-top" d="M 68,250 A 182,182 0 1,1 432,250" fill="none" />
    
    <!-- Bottom Arc: Reads "PUNJAB (INDIA)" counter-clockwise -->
    <path id="text-path-bottom" d="M 432,250 A 182,182 0 0,1 68,250" fill="none" />
  </defs>

  <!-- Outer White Ring -->
  <circle cx="250" cy="250" r="215" stroke="#000000" stroke-width="6" fill="#FFFFFF" />
  <circle cx="250" cy="250" r="162" stroke="#000000" stroke-width="5" fill="none" />

  <!-- Inner Orange Sunburst Background -->
  <g clip-path="url(#inner-circle-clip)">
    <!-- Orange Background Base -->
    <rect x="50" y="50" width="400" height="400" fill="#E86C00" />
    
    <!-- Black Sunburst Rays radiating from bottom-left corner -->
    <polygon points="110,410 135,100 162,110" fill="#000000" />
    <polygon points="110,410 270,90  298,125" fill="#000000" />
    <polygon points="110,410 395,200 405,245" fill="#000000" />
    <polygon points="110,410 425,350 390,405" fill="#000000" />
  </g>

  <!-- Black Dots on Left and Right sides -->
  <circle cx="95" cy="370" r="6" fill="#000000" />
  <circle cx="405" cy="370" r="6" fill="#000000" />

  <!-- Curved Circular Text -->
  <!-- Top Text: LOVELY PROFESSIONAL UNIVERSITY -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#000000" letter-spacing="2">
    <textPath href="#text-path-top" startOffset="50%" text-anchor="middle">
      LOVELY PROFESSIONAL UNIVERSITY
    </textPath>
  </text>

  <!-- Bottom Text: PUNJAB (INDIA) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#000000" letter-spacing="3">
    <textPath href="#text-path-bottom" startOffset="50%" text-anchor="middle">
      PUNJAB (INDIA)
    </textPath>
  </text>
</svg>